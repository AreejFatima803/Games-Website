<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Wood Screw Puzzle - Master Woodcraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrapper">
    <!-- Top Game Header / HUD -->
    <header class="game-header">
      <div class="hud-top">
        <button id="btn-levels" class="hud-btn icon-btn" title="Level Map">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
          </svg>
        </button>

        <div class="level-info">
          <h1 id="level-title">Level 1</h1>
          <div class="level-progress-dots" id="level-dots">
            <span class="dot active"></span>
            <span class="dot active"></span>
            <span class="dot"></span>
          </div>
        </div>

        <div class="hud-actions">
          <button id="btn-sound" class="hud-btn icon-btn" title="Toggle Sound">
            <svg id="icon-sound-on" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg id="icon-sound-off" class="hidden" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>
          <button id="btn-restart" class="hud-btn icon-btn" title="Restart Level">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Timer & Objective Badge -->
      <div class="hud-timer-bar">
        <div class="timer-pill" id="timer-pill">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
          </svg>
          <span id="timer-text">01:30</span>
        </div>
        <div class="planks-left-badge" id="planks-badge">
          <span class="badge-label">Planks:</span>
          <span id="planks-count" class="badge-val">4</span>
        </div>
      </div>
    </header>

    <!-- Interactive Canvas Game Area -->
    <main class="canvas-container" id="canvas-container">
      <canvas id="gameCanvas"></canvas>
      <div id="tutorial-hint" class="tutorial-hint hidden">
        <span class="hint-icon">👆</span>
        <span id="tutorial-text">Tap a screw to unscrew, then tap an open hole!</span>
      </div>
    </main>

    <!-- Bottom Action Controls -->
    <footer class="game-footer">
      <button id="btn-undo" class="action-btn" title="Undo last screw movement">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
        </svg>
        <span>Undo</span>
        <span class="badge" id="undo-count">3</span>
      </button>

      <button id="btn-hint" class="action-btn highlight-btn" title="Get a hint">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-1.3l-.85-.6A5.003 5.003 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"/>
        </svg>
        <span>Hint</span>
      </button>
    </footer>

    <!-- Level Complete Modal -->
    <div id="modal-win" class="modal-backdrop hidden">
      <div class="modal-card win-card animate-pop">
        <div class="confetti-container" id="confetti-container"></div>
        <div class="trophy-icon">🏆</div>
        <h2>Level Completed!</h2>
        <p class="win-sub">Shaandar! Level Clear Ho Gaya!</p>
        
        <div class="stars-row" id="win-stars">
          <span class="star star-1 filled">★</span>
          <span class="star star-2 filled">★</span>
          <span class="star star-3 filled">★</span>
        </div>

        <div class="win-stats">
          <div class="stat-item">
            <span class="stat-lbl">Time</span>
            <span class="stat-val" id="win-time">00:24</span>
          </div>
          <div class="stat-item">
            <span class="stat-lbl">Moves</span>
            <span class="stat-val" id="win-moves">6</span>
          </div>
          <div class="stat-item">
            <span class="stat-lbl">Score</span>
            <span class="stat-val highlight" id="win-score">+1,500</span>
          </div>
        </div>

        <div class="auto-next-bar">
          <div class="auto-next-label">
            <span>Agla level shuru ho raha hai: <strong id="auto-next-sec">3</strong>s</span>
          </div>
          <div class="progress-track">
            <div id="auto-next-fill" class="progress-fill"></div>
          </div>
        </div>

        <div class="modal-actions">
          <button id="btn-replay-level" class="btn-secondary">Replay ↺</button>
          <button id="btn-next-level" class="btn-primary">Next Level ➔</button>
        </div>
      </div>
    </div>

    <!-- Time's Up / Game Over Modal -->
    <div id="modal-lose" class="modal-backdrop hidden">
      <div class="modal-card lose-card animate-pop">
        <div class="lose-icon">⏳</div>
        <h2>Waqt Khatam!</h2>
        <p class="lose-sub">Dobara koshish karein!</p>
        <div class="modal-actions">
          <button id="btn-levels-lose" class="btn-secondary">Levels Map</button>
          <button id="btn-retry" class="btn-primary">Try Again 🔄</button>
        </div>
      </div>
    </div>

    <!-- Level Map Selection Drawer -->
    <div id="modal-level-select" class="modal-backdrop hidden">
      <div class="modal-card levels-card animate-pop">
        <div class="modal-header">
          <h2>Select Level</h2>
          <button id="btn-close-levels" class="btn-close">&times;</button>
        </div>
        <p class="levels-sub">Mukammal karein aur aagay barhein!</p>
        <div class="levels-grid" id="levels-grid">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
