<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo King</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MAIN MENU SCREEN -->
    <div id="menu-screen" class="screen active">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo-area">
                <div class="logo-grid">
                    <div class="logo-red"></div>
                    <div class="logo-green"></div>
                    <div class="logo-blue"></div>
                    <div class="logo-yellow"></div>
                </div>
                <span>LUDO KING</span>
            </div>
            
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="Search...">
                <button type="button" class="search-btn">Search</button>
            </div>
            
            <button class="btn-play-now bottom-nav-btn">PLAY NOW</button>
        </div>
        
        <!-- Main Content Area -->
        <div class="menu-main">
            <!-- Left Side: Board Preview -->
            <div class="preview-section">
                <img src="image.png" alt="Board Preview" class="board-preview-img">
                <button class="btn-play-now large">PLAY NOW</button>
            </div>
            
            <!-- Right Side: Game Modes -->
            <div class="modes-section">
                <h1 class="hero-text"><span class="highlight">#1</span> GAME ON<br>GOOGLE PLAY<br>& APP STORE</h1>
                
                <div class="modes-grid">
                    <div class="mode-btn" data-mode="online">
                        <div class="mode-icon globe">🌍</div>
                        <div class="mode-text">PLAY<br>ONLINE</div>
                    </div>
                    <div class="mode-btn" data-mode="friends">
                        <div class="mode-icon hearts">💞</div>
                        <div class="mode-text">PLAY WITH<br>FRIENDS</div>
                    </div>
                    <div class="mode-btn" data-mode="computer">
                        <div class="mode-icon computer">💻</div>
                        <div class="mode-text">COMPUTER</div>
                    </div>
                    <div class="mode-btn" data-mode="passnplay">
                        <div class="mode-icon pass-play">👥</div>
                        <div class="mode-text">PASS N PLAY</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME BOARD SCREEN (Hidden initially) -->
    <div id="game-screen" class="screen">
        <div class="game-container">
            <!-- Top Controls (Player 3 Red / Player 2 Green) -->
            <div class="top-controls" id="top-controls">
                <div class="dice-box" id="dice-red" style="visibility: hidden;">
                    <div class="pin-wrapper red-token" style="position:relative; transform:none; top:auto; left:auto;">
                        <div class="pin-base"></div>
                        <div class="pin-body"></div>
                        <div class="pin-dot"></div>
                    </div>
                    <div class="die-container">
                        <div class="die"><div class="die-dot"></div></div>
                    </div>
                </div>
                <div class="dice-box" id="dice-green" style="visibility: hidden;">
                    <div class="die-container">
                        <div class="die"><div class="die-dot"></div></div>
                    </div>
                    <div class="pin-wrapper green-token" style="position:relative; transform:none; top:auto; left:auto;">
                        <div class="pin-base"></div>
                        <div class="pin-body"></div>
                        <div class="pin-dot"></div>
                    </div>
                </div>
            </div>

            <!-- The Game Board -->
            <div class="board-container">
                <div class="board" id="main-board">
                    <!-- Path cells generated by JS -->
                    <!-- Tokens will be placed absolutely over this board -->
                </div>
            </div>

            <!-- Bottom Controls (Player 1 Blue / Player 4 Yellow) -->
            <div class="bottom-controls" id="bottom-controls">
                <div class="dice-box" id="dice-blue" style="visibility: hidden;">
                    <div class="pin-wrapper blue-token" style="position:relative; transform:none; top:auto; left:auto;">
                        <div class="pin-base"></div>
                        <div class="pin-body"></div>
                        <div class="pin-dot"></div>
                    </div>
                    <div class="die-container">
                        <div class="die"><div class="die-dot"></div></div>
                    </div>
                </div>
                <div class="dice-box" id="dice-yellow" style="visibility: hidden;">
                    <div class="die-container">
                        <div class="die"><div class="die-dot"></div></div>
                    </div>
                    <div class="pin-wrapper yellow-token" style="position:relative; transform:none; top:auto; left:auto;">
                        <div class="pin-base"></div>
                        <div class="pin-body"></div>
                        <div class="pin-dot"></div>
                    </div>
                </div>
                
                <div class="hint-container" id="dice-hint">
                    <div class="hand-icon">
                        <svg viewBox="0 0 24 24" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 11V8a2 2 0 0 0-2-2h-1.5a2 2 0 0 0-1.7.9A2 2 0 0 0 11 6H9.5a2 2 0 0 0-2 2v6"/>
                            <path d="M14 11V9a2 2 0 0 0-2-2H9.5a2 2 0 0 0-2 2v7.5"/>
                            <path d="M7.5 13.5v-3a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4.82a4 4 0 0 0 1.17 2.83l3.5 3.5a2.5 2.5 0 0 0 1.77.73H15a4 4 0 0 0 4-4V11a2 2 0 0 0-2-2h-3"/>
                        </svg>
                    </div>
                    <div class="hint-text">
                        <span class="arrow-up-text">↑</span>Tap here to<br>roll the dice
                    </div>
                </div>
            </div>
            
            <button id="btn-back-menu" class="btn-back">← Back to Menu</button>
        </div>
    </div>

    <!-- PLAYER SELECTION MODAL -->
    <div id="player-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Select Players</h2>
            <div class="player-options">
                <button class="btn-player-count" data-count="2">2 Players</button>
                <button class="btn-player-count" data-count="3">3 Players</button>
                <button class="btn-player-count" data-count="4">4 Players</button>
            </div>
            <button id="btn-close-modal" class="btn-back">Cancel</button>
        </div>
    </div>
    
    <!-- GAME OVER MODAL -->
    <div id="game-over-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Game Over!</h2>
            <h3 id="winner-text">Player 1 Wins!</h3>
            <button id="btn-play-again" class="btn-play-now">Main Menu</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
