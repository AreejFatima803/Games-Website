<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradEmoji" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="yellowFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="emojiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradEmoji)" />

  <!-- Sparkling background stars -->
  <circle cx="50" cy="50" r="3" fill="#fbcfe8" opacity="0.8" />
  <circle cx="340" cy="70" r="4" fill="#a5f3fc" opacity="0.9" />
  <circle cx="80" cy="330" r="3" fill="#fed7aa" opacity="0.7" />
  <circle cx="320" cy="310" r="5" fill="#fde047" opacity="0.9" />
  <circle cx="360" cy="200" r="2" fill="#fff" opacity="0.8" />
  <circle cx="40" cy="180" r="3" fill="#fff" opacity="0.8" />

  <!-- Connecting Glowing Laser Beam -->
  <path d="M120 160 Q 200 60 280 160 T 200 280" fill="none" stroke="url(#laserGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="12 6" filter="url(#emojiGlow)" />

  <!-- Left Emoji: Heart Eyes 😍 -->
  <g transform="translate(110, 160)">
    <circle cx="0" cy="0" r="55" fill="url(#yellowFace)" stroke="#ca8a04" stroke-width="3" filter="url(#emojiGlow)" />
    <!-- Heart Eyes -->
    <path d="M-28 -20 C-38 -32, -18 -42, -28 -12 Z M-28 -20 C-18 -32, -38 -42, -28 -12 Z" fill="#ef4444" />
    <path d="M-34 -15 A 8 8 0 0 1 -20 -15 Q -27 0 -34 -15 Z" fill="#dc2626" />
    <path d="M-20 -15 A 8 8 0 0 1 -6 -15 Q -13 0 -20 -15 Z" fill="#dc2626" />
    
    <path d="M6 -15 A 8 8 0 0 1 20 -15 Q 13 0 6 -15 Z" fill="#dc2626" />
    <path d="M20 -15 A 8 8 0 0 1 34 -15 Q 27 0 20 -15 Z" fill="#dc2626" />
    <!-- Happy open mouth -->
    <path d="M-22 10 Q 0 35 22 10 Q 0 15 -22 10 Z" fill="#78350f" />
    <path d="M-14 18 Q 0 32 14 18 Q 0 22 -14 18 Z" fill="#ef4444" />
  </g>

  <!-- Right Emoji: Laugh Tears 😂 -->
  <g transform="translate(290, 160)">
    <circle cx="0" cy="0" r="55" fill="url(#yellowFace)" stroke="#ca8a04" stroke-width="3" filter="url(#emojiGlow)" />
    <!-- Laughing Eyes -->
    <path d="M-32 -10 Q -22 -24 -12 -10" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
    <path d="M12 -10 Q 22 -24 32 -10" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
    <!-- Big Laugh Mouth -->
    <path d="M-28 6 Q 0 44 28 6 Z" fill="#78350f" />
    <path d="M-20 8 Q 0 8 20 8 Q 0 30 -20 8 Z" fill="#ffffff" />
    <!-- Blue Tears -->
    <path d="M-42 -2 C-52 10 -42 22 -36 12 Z" fill="#38bdf8" />
    <path d="M42 -2 C52 10 42 22 36 12 Z" fill="#38bdf8" />
  </g>

  <!-- Star Particle Badge Top Center -->
  <g transform="translate(200, 70)">
    <polygon points="0,-22 7,-7 22,-7 11,3 15,18 0,9 -15,18 -11,3 -22,-7 -7,-7" fill="#fde047" stroke="#eab308" stroke-width="2" filter="url(#emojiGlow)" />
  </g>

  <!-- Bottom Title Pill -->
  <g transform="translate(200, 355)">
    <rect x="-145" y="-22" width="290" height="44" rx="22" fill="#1e1b4b" stroke="#ec4899" stroke-width="3" />
    <text x="0" y="7" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="19" font-weight="900" fill="#ffffff" letter-spacing="1.2">EMOJI MATCH</text>
  </g>
</svg>
